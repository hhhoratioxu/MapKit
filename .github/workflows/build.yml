name: Build
on:
  workflow_call:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Update Package Version from Tag
        if: github.ref_type == 'tag'
        uses: BellCubeDev/update-package-version-by-release-tag@v2
        with:
          version: ${{ github.ref_name }}
          keep-v: "false" # If set to "true", will not remove any 'v' prefix from the version number.
          ignore-semver-check: "false" # If set to "true", will not check if the version number is a valid semver version.
      - name: Setup stable Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_TOKEN || github.token }}
      - name: Build native Loon entry points
        run: npm run build:loon
      - name: Run regression tests
        run: node --test test/*.test.js
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: |
            CHANGELOG.md
            dist
            Loon/script
            docs/stability-v1.md
